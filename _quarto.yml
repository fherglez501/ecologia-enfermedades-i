project:
  type: default
  output-dir: _rendered

lang: es

format:
  revealjs:
    theme:
      - default
      - presentations/_assets/theme/esmvz.scss
    width: 1600
    height: 900
    margin: 0.04
    center: false
    controls: false
    progress: true
    slide-number: c/t
    hash: true
    transition: fade
    background-transition: fade
    navigation-mode: linear
    code-overflow: wrap
    code-line-numbers: false
    incremental: false
    embed-resources: true

execute:
  freeze: auto
  warning: false
  message: false
